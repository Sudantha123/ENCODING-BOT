
name: Run Encoding Bot

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: encoding-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    name: Telegram Video Encoder Bot
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      # Install FFmpeg
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            mediainfo \
            git \
            wget \
            pv

          ffmpeg -version | head -n 1

      # Install requirements
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install --no-cache-dir -r requirements.txt

      # Validate configuration
      - name: Validate Configuration
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          set -e

          for key in API_ID API_HASH BOT_TOKEN MONGO_URI OWNER_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing secret: $key"
              exit 1
            fi
          done

          echo "Configuration validation successful!"

      # Start bot
      - name: Run Telegram Video Encoder Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

          # MongoDB
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SESSION_NAME: ${{ secrets.SESSION_NAME || 'VideoEncoder' }}

          # Telegram users
          OWNER_ID: ${{ secrets.OWNER_ID }}
          SUDO_USERS: ${{ secrets.SUDO_USERS || '' }}
          EVERYONE_CHATS: ${{ secrets.EVERYONE_CHATS || '' }}
          LOG_CHANNEL: ${{ secrets.LOG_CHANNEL }}

          # Optional settings
          DRIVE_DIR: ${{ secrets.DRIVE_DIR || '' }}
          INDEX_URL: ${{ secrets.INDEX_URL || '' }}

          # Working directories
          DOWNLOAD_DIR: /tmp/videoencoder/downloads
          ENCODE_DIR: /tmp/videoencoder/encodes

        run: |
          set -e

          mkdir -p /tmp/videoencoder/downloads
          mkdir -p /tmp/videoencoder/encodes

          echo "===================================="
          echo "      VIDEO ENCODER BOT"
          echo "===================================="

          echo "Python:"
          python --version

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "Starting VideoEncoder..."

          python -u -m VideoEncoder
