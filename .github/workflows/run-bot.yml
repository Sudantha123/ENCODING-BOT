name: Run Encoding Bot

on:
  workflow_dispatch:
  schedule:
    # සෑම පැය 5කට වරක්ම አලුත් workflow run එකක් ආරම්භ කරයි
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 320 # මිනිත්තු 320කින් ක්‍රියාවලිය අවසන් කර ඊළඟ run එකට ඉඩ සලසයි

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Telegram Video Encoder Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          SUDO_USERS: ${{ secrets.SUDO_USERS || '' }}
          LOG_CHANNEL: ${{ secrets.LOG_CHANNEL }}
          EVERYONE_CHATS: ${{ vars.EVERYONE_CHATS || '' }}
          DOWNLOAD_DIR: ${{ vars.DOWNLOAD_DIR || './downloads' }}
          ENCODE_DIR: ${{ vars.ENCODE_DIR || './encode' }}
        run: |
          python3 -m VideoEncoder
