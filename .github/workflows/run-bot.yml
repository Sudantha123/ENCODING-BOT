name: Run Encoding Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Telegram Video Encoder Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME || 'VideoEncoder' }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'VideoEncoder' }}
          DB_NAME: ${{ vars.DB_NAME || 'VideoEncoder' }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          SUDO_USERS: ${{ secrets.SUDO_USERS || secrets.OWNER_ID }}
          EVERYONE_CHATS: ${{ vars.EVERYONE_CHATS || secrets.OWNER_ID }}
          LOG_CHANNEL: ${{ secrets.LOG_CHANNEL }}
          DOWNLOAD_DIR: ${{ vars.DOWNLOAD_DIR || './downloads' }}
          ENCODE_DIR: ${{ vars.ENCODE_DIR || './encode' }}
        run: |
          python3 -m VideoEncoder
