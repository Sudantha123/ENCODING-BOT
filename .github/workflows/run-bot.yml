name: Run Encoding Bot

on:
  workflow_dispatch:

  schedule:
    # GitHub cron uses UTC. Runs every 6 hours.
    - cron: '0 */6 * * *'

concurrency:
  group: encoding-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    name: Telegram Video Encoder Bot
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            mediainfo \
            git \
            wget \
            pv

          ffmpeg -version | head -n 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Validate Configuration
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          LOG_CHANNEL: ${{ secrets.LOG_CHANNEL }}
        shell: bash
        run: |
          set -euo pipefail

          for key in API_ID API_HASH BOT_TOKEN MONGO_URI OWNER_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required repository secret: $key"
              exit 1
            fi
          done

          # Catch accidental whitespace/newlines without printing credentials.
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, parse_qs

          uri = os.environ["MONGO_URI"]
          if uri != uri.strip() or "\\n" in uri or "\\r" in uri:
              raise SystemExit("MONGO_URI contains leading/trailing whitespace or literal line breaks.")
          parsed = urlsplit(uri)
          if parsed.scheme not in ("mongodb", "mongodb+srv") or not parsed.hostname:
              raise SystemExit("MONGO_URI does not look like a valid MongoDB URI.")
          print("MongoDB URI format: OK (credentials hidden)")
          print("OWNER_ID format: OK" if os.environ["OWNER_ID"].strip() else "OWNER_ID is empty")
          PY

          echo "Required configuration is present."

      - name: Run Telegram Video Encoder Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

          MONGO_URI: ${{ secrets.MONGO_URI }}
          SESSION_NAME: ${{ secrets.SESSION_NAME || 'VideoEncoder' }}

          OWNER_ID: ${{ secrets.OWNER_ID }}
          SUDO_USERS: ${{ secrets.SUDO_USERS || '' }}
          EVERYONE_CHATS: ${{ secrets.EVERYONE_CHATS || '' }}
          LOG_CHANNEL: ${{ secrets.LOG_CHANNEL }}

          DRIVE_DIR: ${{ secrets.DRIVE_DIR || '' }}
          INDEX_URL: ${{ secrets.INDEX_URL || '' }}

          DOWNLOAD_DIR: /tmp/videoencoder/downloads/
          ENCODE_DIR: /tmp/videoencoder/encodes/

        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$DOWNLOAD_DIR" "$ENCODE_DIR"

          echo "===================================="
          echo "      VIDEO ENCODER BOT"
          echo "===================================="
          python --version
          ffmpeg -version | head -n 1

          echo "Starting VideoEncoder..."
          exec python -u -m VideoEncoder
